name = "jkcbikemap"
main = "src/index.ts"
compatibility_date = "2024-05-23"

[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "jkcbikemap_db"
database_id = "9140840a-3ad5-4834-bdbb-fa5dc2a4bf1a"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "b9d90043ab294eafb7513be63ef51070"
preview_id = "0ca8e11e659d4bd192407a0dc7a0a366"

[[kv_namespaces]]
binding = "ROUTE_CACHE"
id = "29b680a7df804023b1d18fc8668b4227"
preview_id = "45f57c0dd9e54664ae316f27f382a6bc"

[[send_email]]
name = "SEND_EMAIL"

[[r2_buckets]]
binding = "AVATARS_BUCKET"
bucket_name = "jkcbikemap-avatars"

[[routes]]
pattern = "jojomap.kcmo.xyz"
custom_domain = true

[[routes]]
pattern = "map.distorted.work"
custom_domain = true

# In case we need durable objects later
# [durable_objects]
# bindings = []
